openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Azad Invoice Automation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries and search
  - name: workPlans
    description: BART work plans / contract context
  - name: employees
    description: Employees and their classifications
  - name: classifications
    description: Classification rate reference data
  - name: invoices
    description: Invoice lifecycle and generation
  - name: packages
    description: Employee pay-period invoice packages
  - name: lineItems
    description: Invoice labor line items
  - name: progressReports
    description: Invoice progress reports
  - name: signatures
    description: Signature library
  - name: reference
    description: Reference data, column definitions, audit log, integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /search:
    get:
      operationId: search
      tags: [dashboard]
      summary: Global search (client, employee, job number)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"

  /work-plans:
    get:
      operationId: listWorkPlans
      tags: [workPlans]
      summary: List work plans
      responses:
        "200":
          description: Work plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkPlan"
    post:
      operationId: createWorkPlan
      tags: [workPlans]
      summary: Create a work plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkPlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPlan"
  /work-plans/{id}:
    get:
      operationId: getWorkPlan
      tags: [workPlans]
      summary: Get a work plan
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Work plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPlan"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWorkPlan
      tags: [workPlans]
      summary: Update a work plan
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkPlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkPlan"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWorkPlan
      tags: [workPlans]
      summary: Delete a work plan
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /classifications:
    get:
      operationId: listClassifications
      tags: [classifications]
      summary: List classification rates
      responses:
        "200":
          description: Classifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Classification"
    post:
      operationId: createClassification
      tags: [classifications]
      summary: Create a classification rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classification"
  /classifications/{id}:
    patch:
      operationId: updateClassification
      tags: [classifications]
      summary: Update a classification rate
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Classification"
    delete:
      operationId: deleteClassification
      tags: [classifications]
      summary: Delete a classification rate
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: workPlanId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
  /invoices/{id}/approve:
    post:
      operationId: approveInvoice
      tags: [invoices]
      summary: Approve an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /invoices/{id}/preview:
    get:
      operationId: getInvoicePreview
      tags: [invoices]
      summary: Get computed invoice preview (financial breakdown)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Computed preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePreview"
  /invoices/{id}/validations:
    get:
      operationId: getInvoiceValidations
      tags: [invoices]
      summary: Get validation flags for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
  /invoices/{id}/time-import:
    post:
      operationId: importTimeData
      tags: [invoices]
      summary: Upload a Procas CSV/Excel export or weekly timesheet to parse labor hours
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TimeImportUpload"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /invoices/{id}/procas-sync:
    post:
      operationId: syncTimesheetsFromProcas
      tags: [invoices]
      summary: Pull timesheets for this invoice's period live from the connected Procas API
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /invoices/{id}/generate:
    post:
      operationId: generateInvoiceFile
      tags: [invoices]
      summary: Generate the populated Excel workbook or PDF for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Generated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedFile"
  /invoices/{id}/line-items:
    get:
      operationId: listLineItems
      tags: [lineItems]
      summary: List labor line items for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Line items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineItem"
    post:
      operationId: createLineItem
      tags: [lineItems]
      summary: Add a labor line item to an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineItem"
  /line-items/{id}:
    patch:
      operationId: updateLineItem
      tags: [lineItems]
      summary: Update a labor line item
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineItem"
    delete:
      operationId: deleteLineItem
      tags: [lineItems]
      summary: Delete a labor line item
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /invoices/{id}/progress-report:
    get:
      operationId: getProgressReport
      tags: [progressReports]
      summary: Get the progress report for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Progress report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReport"
    put:
      operationId: saveProgressReport
      tags: [progressReports]
      summary: Create or update the progress report for an invoice
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReportInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReport"

  /signatures:
    get:
      operationId: listSignatures
      tags: [signatures]
      summary: List saved signatures
      responses:
        "200":
          description: Signatures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signature"
    post:
      operationId: uploadSignature
      tags: [signatures]
      summary: Upload a signature image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SignatureUpload"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signature"
  /signatures/{id}:
    delete:
      operationId: deleteSignature
      tags: [signatures]
      summary: Delete a signature
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /column-definitions:
    get:
      operationId: listColumnDefinitions
      tags: [reference]
      summary: List column definitions (field reference)
      responses:
        "200":
          description: Column definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ColumnDefinition"

  /reference-data:
    get:
      operationId: listReferenceData
      tags: [reference]
      summary: List reference data entries (rates and pools)
      responses:
        "200":
          description: Reference entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceEntry"
  /reference-data/{id}:
    patch:
      operationId: updateReferenceData
      tags: [reference]
      summary: Update a reference data entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceEntry"

  /billing-rule-sheets:
    get:
      operationId: listBillingRuleSheets
      tags: [reference]
      summary: List billing rule cheat-sheets
      responses:
        "200":
          description: Billing rule cheat-sheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingRuleSheet"
    post:
      operationId: uploadBillingRuleSheet
      tags: [reference]
      summary: Upload a billing rule cheat-sheet (Excel/Word/PDF/image)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BillingRuleSheetUpload"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRuleSheet"
        "400":
          description: Invalid or unsupported file
  /billing-rule-sheets/{id}:
    delete:
      operationId: deleteBillingRuleSheet
      tags: [reference]
      summary: Delete a billing rule cheat-sheet
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [reference]
      summary: List audit log entries
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /procas/status:
    get:
      operationId: getProcasStatus
      tags: [reference]
      summary: Get Procas integration status
      responses:
        "200":
          description: Procas status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcasStatus"

  /procas/connect:
    post:
      operationId: connectProcas
      tags: [reference]
      summary: Connect the live Procas API (validates and stores credentials)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcasConnectInput"
      responses:
        "200":
          description: Procas status after connecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcasStatus"

  /procas/disconnect:
    post:
      operationId: disconnectProcas
      tags: [reference]
      summary: Disconnect the live Procas API and revert to upload mode
      responses:
        "200":
          description: Procas status after disconnecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcasStatus"

  /procas/scheduler:
    get:
      operationId: getProcasScheduler
      tags: [reference]
      summary: Get the background Procas refresh schedule and last cycle result
      responses:
        "200":
          description: Procas scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcasSchedulerStatus"
    put:
      operationId: updateProcasScheduler
      tags: [reference]
      summary: Update the background Procas refresh interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcasSchedulerInput"
      responses:
        "200":
          description: Updated Procas scheduler status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcasSchedulerStatus"

  /procas/refresh:
    post:
      operationId: refreshProcasNow
      tags: [reference]
      summary: Run a full Procas refresh cycle for all open invoices immediately
      responses:
        "200":
          description: Scheduler status reflecting the on-demand cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcasSchedulerStatus"

  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List packages
      parameters:
        - name: employeeId
          in: query
          schema: { type: integer }
        - name: workPlanId
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageSummary"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageSummary"
  /packages/grouped:
    get:
      operationId: listPackagesGrouped
      tags: [packages]
      summary: Packages grouped Client -> Job Number -> Invoice
      responses:
        "200":
          description: Grouped packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackageClientGroup"
  /packages/{id}:
    get:
      operationId: getPackage
      tags: [packages]
      summary: Get a package with weeks, entries, progress and rollup
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Package detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePackage
      tags: [packages]
      summary: Update a package
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageSummary"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a package
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/weeks:
    post:
      operationId: createPackageWeek
      tags: [packages]
      summary: Add a week to a package
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageWeekInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageWeek"
  /packages/{id}/weeks/{weekId}:
    patch:
      operationId: updatePackageWeek
      tags: [packages]
      summary: Update a package week
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: weekId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageWeekUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageWeek"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePackageWeek
      tags: [packages]
      summary: Delete a package week and its entries
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: weekId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/entries:
    post:
      operationId: createTimesheetEntry
      tags: [packages]
      summary: Add a timesheet entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEntry"
  /packages/{id}/entries/{entryId}:
    patch:
      operationId: updateTimesheetEntry
      tags: [packages]
      summary: Update a timesheet entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: entryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimesheetEntryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimesheetEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTimesheetEntry
      tags: [packages]
      summary: Delete a timesheet entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: entryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/progress-report:
    get:
      operationId: getPackageProgressReport
      tags: [packages]
      summary: Get a package progress report
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Progress report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageProgressReport"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: savePackageProgressReport
      tags: [packages]
      summary: Create or update a package progress report
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageProgressReportInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageProgressReport"
  /packages/{id}/progress-report/upload:
    post:
      operationId: uploadProgressReportFile
      tags: [packages]
      summary: Upload a progress report document (Excel/Word/PDF) and get a stored URL
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ProgressReportFileUpload"
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportFileUploadResult"
        "400":
          description: Invalid or unsupported file
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/overrides:
    get:
      operationId: listLaborOverrides
      tags: [packages]
      summary: List labor attachment overrides
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaborOverride"
    put:
      operationId: saveLaborOverride
      tags: [packages]
      summary: Create or update a labor attachment override
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaborOverrideInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaborOverride"
  /packages/{id}/overrides/{cellKey}:
    delete:
      operationId: deleteLaborOverride
      tags: [packages]
      summary: Delete a labor attachment override
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: cellKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/validations:
    get:
      operationId: getPackageValidations
      tags: [packages]
      summary: Validate a package and flag anomalies
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageValidationResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/rollup:
    get:
      operationId: getPackageRollup
      tags: [packages]
      summary: Labor rollup and computed financials for a package
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageRollup"
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/documents/{doc}/generate:
    post:
      operationId: generatePackageDocument
      tags: [packages]
      summary: Generate one of the five package documents (xlsx or pdf)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: doc
          in: path
          required: true
          schema:
            type: string
            enum: [invoice, subcalc, progress, labor, timesheets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Generated file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedFile"
        "404":
          $ref: "#/components/responses/NotFound"
  /packages/{id}/export:
    post:
      operationId: exportPackage
      tags: [packages]
      summary: Generate all five documents and bundle them as a ZIP
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Export bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageExport"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    WorkPlan:
      type: object
      required:
        - id
        - code
        - title
        - client
        - jobNumber
        - totalBudget
        - fringeRate
        - fixedFeeRate
        - billingCycle
        - status
        - createdAt
      properties:
        id: { type: integer }
        code: { type: string }
        title: { type: string }
        client: { type: string }
        jobNumber: { type: string }
        agreementNo: { type: ["string", "null"] }
        poNumber: { type: ["string", "null"] }
        wspProjectNo: { type: ["string", "null"] }
        totalBudget: { type: number }
        fringeRate: { type: number }
        overheadRate: { type: ["number", "null"] }
        fixedFeeRate: { type: number }
        fccmRate: { type: ["number", "null"] }
        billingCycle:
          type: string
          enum: [whole_month, last_friday]
        status:
          type: string
          enum: [active, archived]
        createdAt: { type: string }
    WorkPlanInput:
      type: object
      required: [code, title, client, jobNumber, totalBudget, billingCycle]
      properties:
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        client: { type: string, minLength: 1 }
        jobNumber: { type: string, minLength: 1 }
        agreementNo: { type: string }
        poNumber: { type: string }
        wspProjectNo: { type: string }
        totalBudget: { type: number }
        fringeRate: { type: number }
        overheadRate: { type: number }
        fixedFeeRate: { type: number }
        fccmRate: { type: number }
        billingCycle:
          type: string
          enum: [whole_month, last_friday]
    WorkPlanUpdate:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        client: { type: string, minLength: 1 }
        jobNumber: { type: string, minLength: 1 }
        agreementNo: { type: string }
        poNumber: { type: string }
        wspProjectNo: { type: string }
        totalBudget: { type: number }
        fringeRate: { type: number }
        overheadRate: { type: number }
        fixedFeeRate: { type: number }
        fccmRate: { type: number }
        billingCycle:
          type: string
          enum: [whole_month, last_friday]
        status:
          type: string
          enum: [active, archived]

    Employee:
      type: object
      required: [id, name, classification, homeRate, active, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        classification: { type: string }
        homeRate: { type: number }
        fieldRate: { type: ["number", "null"] }
        payRate: { type: ["number", "null"] }
        defaultTaskNo: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string }
    EmployeeInput:
      type: object
      required: [name, classification, homeRate]
      properties:
        name: { type: string, minLength: 1 }
        classification: { type: string, minLength: 1 }
        homeRate: { type: number }
        fieldRate: { type: number }
        defaultTaskNo: { type: string }
        active: { type: boolean }
    EmployeeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        classification: { type: string, minLength: 1 }
        homeRate: { type: number }
        fieldRate: { type: number }
        defaultTaskNo: { type: string }
        active: { type: boolean }

    Classification:
      type: object
      required: [id, code, description, regularRate, location]
      properties:
        id: { type: integer }
        code: { type: string }
        description: { type: string }
        regularRate: { type: number }
        otRate: { type: ["number", "null"] }
        dtRate: { type: ["number", "null"] }
        location:
          type: string
          enum: [home, field, both]
        effectiveDate: { type: ["string", "null"] }
    ClassificationInput:
      type: object
      required: [code, description, regularRate, location]
      properties:
        code: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        regularRate: { type: number }
        otRate: { type: number }
        dtRate: { type: number }
        location:
          type: string
          enum: [home, field, both]
        effectiveDate: { type: string }
    ClassificationUpdate:
      type: object
      properties:
        code: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        regularRate: { type: number }
        otRate: { type: number }
        dtRate: { type: number }
        location:
          type: string
          enum: [home, field, both]
        effectiveDate: { type: string }

    Invoice:
      type: object
      required:
        - id
        - workPlanId
        - workPlanCode
        - client
        - invoiceNumber
        - invoiceDate
        - periodStart
        - periodEnd
        - status
        - laborTotal
        - fringeTotal
        - overheadTotal
        - fixedFee
        - fccm
        - otdtPremium
        - otherDirectCosts
        - totalThisPeriod
        - previouslyBilled
        - totalToDate
        - remainingBalance
        - percentExpended
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        workPlanId: { type: integer }
        workPlanCode: { type: string }
        client: { type: string }
        invoiceNumber: { type: string }
        invoiceDate: { type: string }
        periodStart: { type: string }
        periodEnd: { type: string }
        status:
          type: string
          enum: [draft, in_review, approved, exported]
        laborTotal: { type: number }
        fringeTotal: { type: number }
        overheadTotal: { type: number }
        fixedFee: { type: number }
        fccm: { type: number }
        otdtPremium: { type: number }
        otherDirectCosts: { type: number }
        totalThisPeriod: { type: number }
        previouslyBilled: { type: number }
        totalToDate: { type: number }
        remainingBalance: { type: number }
        percentExpended: { type: number }
        preparedBy: { type: ["string", "null"] }
        approvedBy: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    InvoiceInput:
      type: object
      required: [workPlanId, invoiceNumber, invoiceDate, periodStart, periodEnd]
      properties:
        workPlanId: { type: integer }
        invoiceNumber: { type: string, minLength: 1 }
        invoiceDate: { type: string }
        periodStart: { type: string }
        periodEnd: { type: string }
        previouslyBilled: { type: number }
        otherDirectCosts: { type: number }
        preparedBy: { type: string }
    InvoiceUpdate:
      type: object
      properties:
        invoiceNumber: { type: string, minLength: 1 }
        invoiceDate: { type: string }
        periodStart: { type: string }
        periodEnd: { type: string }
        previouslyBilled: { type: number }
        otherDirectCosts: { type: number }
        preparedBy: { type: string }
        status:
          type: string
          enum: [draft, in_review, approved, exported]
    ApprovalInput:
      type: object
      required: [approvedBy]
      properties:
        approvedBy: { type: string, minLength: 1 }
        signatureId: { type: integer }
        budgetOverride:
          type: boolean
          description: >-
            Explicit acknowledgement that this invoice exceeds its work plan
            budget. Required to approve an over-budget invoice; the override is
            recorded in the audit log.
        budgetOverrideReason:
          type: string
          description: Optional justification recorded with a budget override.

    LineItem:
      type: object
      required:
        - id
        - invoiceId
        - employeeName
        - classification
        - category
        - location
        - hours
        - rate
        - amount
      properties:
        id: { type: integer }
        invoiceId: { type: integer }
        employeeId: { type: ["integer", "null"] }
        employeeName: { type: string }
        classification: { type: string }
        category:
          type: string
          enum: [regular, ot, dt, holiday, pto]
        location:
          type: string
          enum: [home, field]
        hours: { type: number }
        rate: { type: number }
        amount: { type: number }
        taskNo: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        source: { type: string }
    LineItemInput:
      type: object
      required: [employeeName, classification, category, location, hours, rate]
      properties:
        employeeId: { type: integer }
        employeeName: { type: string, minLength: 1 }
        classification: { type: string, minLength: 1 }
        category:
          type: string
          enum: [regular, ot, dt, holiday, pto]
        location:
          type: string
          enum: [home, field]
        hours: { type: number }
        rate: { type: number }
        taskNo: { type: string }
        notes: { type: string }
    LineItemUpdate:
      type: object
      properties:
        employeeId: { type: integer }
        employeeName: { type: string, minLength: 1 }
        classification: { type: string, minLength: 1 }
        category:
          type: string
          enum: [regular, ot, dt, holiday, pto]
        location:
          type: string
          enum: [home, field]
        hours: { type: number }
        rate: { type: number }
        taskNo: { type: string }
        notes: { type: string }

    ProgressReport:
      type: object
      required: [id, invoiceId, percentComplete, summary, reportDate]
      properties:
        id: { type: integer }
        invoiceId: { type: integer }
        percentComplete: { type: number }
        summary: { type: string }
        workCompleted: { type: ["string", "null"] }
        workPlanned: { type: ["string", "null"] }
        issues: { type: ["string", "null"] }
        scheduleStatus: { type: ["string", "null"] }
        budgetStatus: { type: ["string", "null"] }
        preparedBy: { type: ["string", "null"] }
        reportDate: { type: string }
    ProgressReportInput:
      type: object
      required: [percentComplete, summary, reportDate]
      properties:
        percentComplete: { type: number }
        summary: { type: string }
        workCompleted: { type: string }
        workPlanned: { type: string }
        issues: { type: string }
        scheduleStatus: { type: string }
        budgetStatus: { type: string }
        preparedBy: { type: string }
        reportDate: { type: string }

    Signature:
      type: object
      required: [id, name, imageUrl, isDefault, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        title: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        imageUrl: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string }
    SignatureUpload:
      type: object
      required: [name, file]
      properties:
        name: { type: string }
        title: { type: string }
        email: { type: string }
        file:
          type: string
          format: binary

    BillingRuleSheet:
      type: object
      required: [id, title, fileUrl, fileName, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        notes: { type: ["string", "null"] }
        fileUrl: { type: string }
        fileName: { type: string }
        contentType: { type: ["string", "null"] }
        createdAt: { type: string }
    BillingRuleSheetUpload:
      type: object
      required: [title, file]
      properties:
        title: { type: string }
        notes: { type: string }
        file:
          type: string
          format: binary

    ProgressReportFileUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    ProgressReportFileUploadResult:
      type: object
      required: [uploadedFileUrl, uploadedFileName]
      properties:
        uploadedFileUrl: { type: string }
        uploadedFileName: { type: string }

    TimeImportUpload:
      type: object
      required: [file]
      properties:
        source:
          type: string
          enum: [procas, timesheet]
        file:
          type: string
          format: binary
    ImportResult:
      type: object
      required: [importedCount, lineItems]
      properties:
        importedCount: { type: integer }
        replacedCount: { type: integer }
        source: { type: string }
        warnings:
          type: array
          items: { type: string }
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"

    GenerateInput:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [xlsx, pdf]
    GeneratedFile:
      type: object
      required: [url, filename, format]
      properties:
        url: { type: string }
        filename: { type: string }
        format: { type: string }
    PackageExport:
      type: object
      required: [url, filename, documentCount, documents]
      properties:
        url: { type: string }
        filename: { type: string }
        documentCount: { type: integer }
        documents:
          type: array
          items:
            type: object
            required: [doc, filename, format]
            properties:
              doc: { type: string }
              filename: { type: string }
              format: { type: string }

    InvoicePreview:
      type: object
      required: [invoice, lineItems, financials, budgetStatus]
      properties:
        invoice:
          $ref: "#/components/schemas/Invoice"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        financials:
          type: array
          items:
            $ref: "#/components/schemas/FinancialLine"
        budgetUsedPercent: { type: number }
        budgetStatus:
          $ref: "#/components/schemas/BudgetStatus"
    BudgetStatus:
      type: object
      required: [level, overBudget, percentExpended, remainingBalance, message]
      properties:
        level:
          type: string
          enum: [ok, approaching, over]
        overBudget: { type: boolean }
        percentExpended: { type: number }
        remainingBalance: { type: number }
        message: { type: string }
    FinancialLine:
      type: object
      required: [label, amount]
      properties:
        label: { type: string }
        amount: { type: number }
        note: { type: ["string", "null"] }
        emphasis: { type: ["boolean", "null"] }

    ValidationResult:
      type: object
      required: [invoiceId, isValid, flags]
      properties:
        invoiceId: { type: integer }
        isValid: { type: boolean }
        flags:
          type: array
          items:
            $ref: "#/components/schemas/ValidationFlag"
    ValidationFlag:
      type: object
      required: [severity, message]
      properties:
        severity:
          type: string
          enum: [error, warning, info]
        field: { type: ["string", "null"] }
        message: { type: string }

    ColumnDefinition:
      type: object
      required: [id, sheet, field, source, description]
      properties:
        id: { type: integer }
        sheet: { type: string }
        column: { type: ["string", "null"] }
        field: { type: string }
        source: { type: string }
        formula: { type: ["string", "null"] }
        description: { type: string }

    ReferenceEntry:
      type: object
      required: [id, category, key, label, value]
      properties:
        id: { type: integer }
        category: { type: string }
        key: { type: string }
        label: { type: string }
        value: { type: string }
        unit: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
    ReferenceEntryUpdate:
      type: object
      required: [value]
      properties:
        value: { type: string }

    AuditLog:
      type: object
      required: [id, userName, action, entityType, createdAt]
      properties:
        id: { type: integer }
        userId: { type: ["string", "null"] }
        userName: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        createdAt: { type: string }

    ProcasStatus:
      type: object
      required: [connected, mode, message]
      properties:
        connected: { type: boolean }
        mode:
          type: string
          enum: [live, upload]
        companyCode: { type: ["string", "null"] }
        username: { type: ["string", "null"] }
        lastSyncAt: { type: ["string", "null"] }
        message: { type: string }

    ProcasConnectInput:
      type: object
      required: [companyCode, username, password]
      properties:
        companyCode: { type: string, minLength: 1 }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    ProcasSchedulerStatus:
      type: object
      required:
        - connected
        - intervalMs
        - running
        - lastSynced
        - lastFailed
        - lastSkipped
      properties:
        connected: { type: boolean }
        intervalMs: { type: integer }
        running: { type: boolean }
        lastRunAt: { type: ["string", "null"] }
        lastSynced: { type: integer }
        lastFailed: { type: integer }
        lastSkipped: { type: boolean }
        lastError: { type: ["string", "null"] }

    ProcasSchedulerInput:
      type: object
      required: [intervalMs]
      properties:
        intervalMs: { type: integer }

    DashboardSummary:
      type: object
      required:
        - totalInvoices
        - draftCount
        - approvedCount
        - totalBilledThisMonth
        - activeWorkPlans
        - invoicesByStatus
        - billingByWorkPlan
        - recentActivity
      properties:
        totalInvoices: { type: integer }
        draftCount: { type: integer }
        approvedCount: { type: integer }
        totalBilledThisMonth: { type: number }
        totalBilledToDate: { type: number }
        totalRemainingBudget: { type: number }
        activeWorkPlans: { type: integer }
        invoicesByStatus:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"
        billingByWorkPlan:
          type: array
          items:
            $ref: "#/components/schemas/WorkPlanBilling"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }
    WorkPlanBilling:
      type: object
      required: [workPlanCode, billed, budget]
      properties:
        workPlanCode: { type: string }
        billed: { type: number }
        budget: { type: number }

    SearchResult:
      type: object
      required: [type, id, label, route]
      properties:
        type:
          type: string
          enum: [workPlan, employee, invoice, package]
        id: { type: integer }
        label: { type: string }
        sublabel: { type: ["string", "null"] }
        route: { type: string }

    PackageSummary:
      type: object
      required:
        - id
        - employees
        - workPlanId
        - workPlanCode
        - jobNumber
        - client
        - payPeriodStart
        - payPeriodEnd
        - previouslyBilled
        - otherDirectCosts
        - status
        - invoiceDocStatus
        - subCalcDocStatus
        - progressReportDocStatus
        - laborAttachmentDocStatus
        - timesheetsDocStatus
        - weekCount
        - totalHours
        - totalThisPeriod
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        employeeId:
          type: ["integer", "null"]
          description: Legacy primary employee; null for job-level packages.
        employeeName:
          type: ["string", "null"]
          description: >-
            Display name — the single contributor's name, or a "Name +N more"
            style label when several employees contributed.
        employees:
          type: array
          description: Employees contributing to this invoice, from timesheet entries.
          items:
            $ref: "#/components/schemas/PackageEmployeeContribution"
        workPlanId: { type: integer }
        workPlanCode: { type: string }
        jobNumber: { type: string }
        client: { type: string }
        payPeriodStart: { type: string }
        payPeriodEnd: { type: string }
        invoiceNumber: { type: ["string", "null"] }
        invoiceDate: { type: ["string", "null"] }
        previouslyBilled: { type: number }
        previouslyBilledSource: { type: ["string", "null"] }
        otherDirectCosts: { type: number }
        signatureId: { type: ["integer", "null"] }
        preparedBy: { type: ["string", "null"] }
        approvedBy: { type: ["string", "null"] }
        status:
          type: string
          enum: [draft, in_review, approved, exported]
        invoiceDocStatus:
          $ref: "#/components/schemas/DocStatus"
        subCalcDocStatus:
          $ref: "#/components/schemas/DocStatus"
        progressReportDocStatus:
          $ref: "#/components/schemas/DocStatus"
        laborAttachmentDocStatus:
          $ref: "#/components/schemas/DocStatus"
        timesheetsDocStatus:
          $ref: "#/components/schemas/DocStatus"
        weekCount: { type: integer }
        totalHours: { type: number }
        totalThisPeriod: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }
    DocStatus:
      type: string
      enum: [not_started, in_progress, ready]
    PackageEmployeeContribution:
      type: object
      required: [employeeName, hours, laborCost]
      properties:
        employeeId: { type: ["integer", "null"] }
        employeeName: { type: string }
        hours: { type: number }
        laborCost:
          type: number
          description: Straight-time labor (hours x rate) before burden.
    PackageInput:
      type: object
      required: [workPlanId, payPeriodStart, payPeriodEnd]
      properties:
        employeeId:
          type: integer
          description: Optional legacy primary employee; contributors come from timesheet entries.
        workPlanId: { type: integer }
        payPeriodStart: { type: string }
        payPeriodEnd: { type: string }
        invoiceNumber: { type: string }
        invoiceDate: { type: string }
        previouslyBilled: { type: number }
        otherDirectCosts: { type: number }
        preparedBy: { type: string }
    PackageUpdate:
      type: object
      properties:
        payPeriodStart: { type: string }
        payPeriodEnd: { type: string }
        invoiceNumber: { type: string }
        invoiceDate: { type: string }
        previouslyBilled: { type: number }
        otherDirectCosts: { type: number }
        signatureId: { type: integer }
        preparedBy: { type: string }
        approvedBy: { type: string }
        status:
          type: string
          enum: [draft, in_review, approved, exported]
        budgetOverride:
          type: boolean
          description: >-
            Explicit acknowledgement that this package exceeds its work plan
            budget. Required to set status to "approved" when over budget; the
            override is recorded in the audit log.
        budgetOverrideReason:
          type: string
          description: Optional justification recorded with a budget override.
        invoiceDocStatus:
          $ref: "#/components/schemas/DocStatus"
        subCalcDocStatus:
          $ref: "#/components/schemas/DocStatus"
        progressReportDocStatus:
          $ref: "#/components/schemas/DocStatus"
        laborAttachmentDocStatus:
          $ref: "#/components/schemas/DocStatus"
        timesheetsDocStatus:
          $ref: "#/components/schemas/DocStatus"

